<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Discovery App - EG04</title>
    <!-- Google Fonts & FontAwesome cho icon -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Header -->
    <header class="app-header">
        <div class="logo">
            <i class="fa-solid fa-film"></i>
            <span>MovieDiscovery</span>
        </div>
        <div class="header-right">
            <!-- Nút chuyển đổi Light/Dark Mode -->
            <button id="theme-toggle" class="theme-toggle-btn" aria-label="Chuyển đổi giao diện">
                <i class="fa-solid fa-moon"></i>
            </button>
        </div>
    </header>

    <!-- Main Layout Container (CSS Grid) -->
    <div class="app-container">
        <!-- Sidebar: Bộ lọc và Tìm kiếm -->
        <aside class="sidebar">
            <h3><i class="fa-solid fa-filter"></i> Bộ lọc tìm kiếm</h3>
            
            <!-- Ô tìm kiếm theo tên -->
            <div class="filter-group">
                <label for="search-input">Tìm kiếm phim</label>
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="search-input" placeholder="Nhập tên phim...">
                </div>
            </div>

            <!-- Danh sách thể loại động (Checkbox) -->
            <div class="filter-group">
                <label>Thể loại</label>
                <div id="genre-filters" class="checkbox-list">
                    <!-- Được tạo tự động bằng JS -->
                </div>
            </div>
        </aside>

        <!-- Main Content: Hiển thị danh sách thẻ phim -->
        <main class="main-content">
            <div class="content-header">
                <h2>Danh sách phim</h2>
                <span id="result-count">Hiển thị 0 phim</span>
            </div>
            
            <!-- Khu vực chứa các Card phim -->
            <div id="movie-grid" class="movie-grid">
                <!-- Được render động bằng JS -->
            </div>
        </main>
    </div>

    <!-- Modal Chi tiết phim -->
    <div id="movie-modal" class="modal">
        <div class="modal-content">
            <button class="modal-close" id="modal-close">&times;</button>
            <div class="modal-body" id="modal-body">
                <!-- Nội dung chi tiết render bằng JS -->
            </div>
        </div>
    </div>

    <!-- Footer tích hợp link bài tập trước -->
    <footer class="app-footer">
        <p>&copy; 2026 Movie Discovery App - Mã đề EG04 | Sinh viên: Lê Hoàng Phúc (MSV: 231A010425)</p>
        <div class="previous-links">
            <span>Link bài tập trước:</span>
            <a href="#" target="_blank">Bài 37</a> | 
            <a href="#" target="_blank">Bài 38</a> | 
            <a href="https://hphuc05.github.io/ltw-bt39/bt39.html" target="_blank">Bài 39</a>
        </div>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
